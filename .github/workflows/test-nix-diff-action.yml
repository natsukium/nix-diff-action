name: Test nix-diff-action

on:
  pull_request:

jobs:
  full:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup-nix
      - name: Run nix-diff-action
        uses: ./
        with:
          attributes: |
            - displayName: devShell
              attribute: devShells.x86_64-linux.default
