name: Test nix-diff-action

on:
  pull_request:

jobs:
  full:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nix
      - name: Run nix-diff-action
        uses: ./
        with:
          attributes: |
            - displayName: devShell
              attribute: devShells.x86_64-linux.default
